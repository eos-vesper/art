  <circle cx="221" cy="196.4" r="70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.45"/>
  <circle cx="186" cy="256" r="70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.45"/>
  <circle cx="221" cy="315.6" r="70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.45"/>
  <circle cx="291" cy="315.6" r="70" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.45"/>
