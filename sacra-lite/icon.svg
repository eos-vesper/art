  <circle cx="186" cy="256" r="3.5" fill="#d4a843" opacity="0.6"/>
  <circle cx="221" cy="315.6" r="3.5" fill="#d4a843" opacity="0.6"/>
  <circle cx="291" cy="315.6" r="3.5" fill="#d4a843" opacity="0.6"/>
